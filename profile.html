<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | TBS</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><main class="login-section"><section class="login-card"><span class="login-eyebrow">TBS ACCOUNT</span><h1>My Profile</h1><p id="profileMessage">Loading your profile...</p><a class="btn btn-dark" href="account.html">Back to account</a></section></main><script src="api-config.js"></script><script src="auth-navigation.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const response=await window.tbsFetch('/users/me',{headers:{Authorization:`Bearer ${localStorage.getItem('tbsToken')}`}});if(response.ok){const user=await response.json();document.getElementById('profileMessage').textContent=`${user.full_name} · ${user.email} · ${user.phone||'No phone added'}`;}});</script></body></html>
