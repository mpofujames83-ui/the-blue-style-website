<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TBS AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<!-- Login page -->
<header>
    <nav class="navbar">
        <div class="logo"><span>TBS</span> AI</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="signup.html">Sign Up</a></li>
        </ul>
        <a href="index.html#shop" class="shop-btn">Shop Now</a>
    </nav>
</header>
<section class="form-section">
    <div class="form-card">
        <h2>Login to Your Account</h2>
        <p>Access your orders, contact support, and manage your account.</p>
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input id="login-password" type="password" class="form-input" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn form-button">Login</button>
        </form>
        <p class="small-text">New here? <a href="signup.html">Create an account</a></p>
    </div>
</section>
<footer>
    <div class="footer-content">
        <h2>TBS AI</h2>
        <p>Technology | Fashion | Printing</p>
        <div class="social">
            <a href="#" aria-label="Facebook" target="_blank" rel="noreferrer"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" aria-label="Instagram" target="_blank" rel="noreferrer"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@james.with.friend?is_from_webapp=1&sender_device=pc" aria-label="TikTok" target="_blank" rel="noreferrer"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://wa.me/263788587669" aria-label="WhatsApp" target="_blank" rel="noreferrer"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
        <p class="footer-copy">© 2026 TBS AI. All Rights Reserved.</p>
    </div>
</footer>
<script src="script.js"></script>
</body>
</html>
