<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | TBS</title><link rel="stylesheet" href="style.css"><style>.checkout-page{max-width:1000px;margin:auto;padding:60px 6%}.checkout-layout{display:grid;grid-template-columns:1fr 340px;gap:18px}.checkout-card{background:#fff;border:1px solid #dce5ef;border-radius:12px;padding:28px;box-shadow:0 14px 35px #071a3310}.checkout-card h1{margin-top:0}.checkout-form{display:grid;gap:14px}.checkout-form label{display:grid;gap:7px;font-size:12px;font-weight:700}.checkout-form input,.checkout-form textarea,.checkout-form select{padding:13px;border:1px solid #dce5ef;border-radius:8px;background:#f5f8fc;font:inherit}.checkout-form input:focus,.checkout-form textarea:focus,.checkout-form select:focus{outline:0;border-color:#0866ff;box-shadow:0 0 0 4px #0866ff15}.summary-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #dce5ef}.status{min-height:22px;color:#b42318}.success{color:#176b3a}@media(max-width:700px){.checkout-page{padding:40px 5%}.checkout-layout{grid-template-columns:1fr}.summary{order:-1}}
</style></head><body class="login-page"><header class="site-header"><nav class="navbar"><a class="logo" href="index.html"><span>TBS</span> The Blue Style</a><a class="shop-btn" href="cart.html">Back to cart</a></nav></header><main class="checkout-page"><span class="login-eyebrow">TBS CHECKOUT</span><div class="checkout-layout"><section class="checkout-card"><h1>Customer Information</h1><form class="checkout-form" id="checkoutForm"><label>Full Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Phone<input name="phone" type="tel" autocomplete="tel" required></label><label>Address<textarea name="address" rows="3" required></textarea></label><label>City<input name="city" required></label><label>Country<input name="country" value="Zimbabwe" required></label><label>Payment method<select name="payment_method"><option value="cash_on_delivery">Cash on delivery</option><option value="ecocash">EcoCash</option><option value="bank_transfer">Bank transfer</option><option value="card">Card gateway</option></select></label><p class="status" id="checkoutStatus"></p><button class="btn btn-primary" type="submit">Place Order</button></form></section><aside class="checkout-card summary"><h2>Order Summary</h2><div id="summaryItems"></div><div class="summary-row"><span>Subtotal</span><strong id="summarySubtotal">$0.00</strong></div><div class="summary-row"><span>Shipping</span><strong id="summaryShipping">$0.00</strong></div><div class="summary-row"><span>Total</span><strong id="summaryTotal">$0.00</strong></div></aside></div></main><script src="api-config.js"></script><script src="js/auth.js"></script><script>const cart=JSON.parse(localStorage.getItem('tbsCart')||'[]'),shipping=5,subtotal=cart.reduce((sum,item)=>sum+Number(item.price)*Number(item.quantity),0);document.getElementById('summaryItems').innerHTML=cart.length?cart.map(item=>`<p>${item.name} × ${item.quantity}</p>`).join(''):'<p>Your cart is empty.</p>';document.getElementById('summarySubtotal').textContent=`$${subtotal.toFixed(2)}`;document.getElementById('summaryShipping').textContent=cart.length?'$5.00':'$0.00';document.getElementById('summaryTotal').textContent=`$${(cart.length?subtotal+shipping:0).toFixed(2)}`;document.getElementById('checkoutForm').addEventListener('submit',async event=>{event.preventDefault();const status=document.getElementById('checkoutStatus');if(!cart.length){status.textContent='Your cart is empty.';return}const data=Object.fromEntries(new FormData(event.target));try{const response=await window.tbsFetch('/orders',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${localStorage.getItem('tbsToken')}`},body:JSON.stringify({delivery_address:`${data.address}, ${data.city}, ${data.country}`,payment_method:data.payment_method,items:cart.map(item=>({product_id:item.id,quantity:Number(item.quantity)}))})});const result=await response.json();if(!response.ok)throw new Error(result.message||'Could not place order');localStorage.removeItem('tbsCart');status.className='status success';status.textContent=`Order placed successfully. Order number: ${result.orderNumber||result.orderId}`;event.target.querySelector('button').disabled=true}catch(error){status.textContent=error.message}});</script></body></html>
