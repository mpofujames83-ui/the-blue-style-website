<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | TBS AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="signup-page">
<!-- Sign Up page -->
<header>
    <nav class="navbar">
        <div class="logo"><span>TBS</span> AI</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html" class="active">Sign Up</a></li>
        </ul>
        <a href="index.html#shop" class="shop-btn">Shop Now</a>
    </nav>
</header>
<section class="form-section">
    <div class="form-card">
        <h2>Create Your Account</h2>
        <p>Join TBS AI and get updates on new products, offers, and exclusive printing deals.</p>
        <form id="signup-form">
            <div class="form-group">
                <label for="signup-name">Full Name</label>
                <input id="signup-name" type="text" class="form-input" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="signup-email">Email</label>
                <input id="signup-email" type="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" class="form-input" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn form-button">Sign Up</button>
            <p id="signup-status" class="signup-status" role="status" aria-live="polite"></p>
        </form>
        <p class="small-text">Already have an account? <a href="login.html">Login here</a></p>
    </div>
</section>
<footer>
    <div class="footer-content">
        <h2>TBS AI</h2>
        <p>Technology | Fashion | Printing</p>
        <div class="social">
            <a href="#" aria-label="Facebook" target="_blank" rel="noreferrer"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" aria-label="Instagram" target="_blank" rel="noreferrer"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@james.with.friend?is_from_webapp=1&sender_device=pc" aria-label="TikTok" target="_blank" rel="noreferrer"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://whatsapp.com/channel/0029VbDYs1n4IBhB6yA5dR1R" aria-label="WhatsApp Channel" target="_blank" rel="noreferrer"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
        <p class="footer-copy">© 2026 TBS AI. All Rights Reserved.</p>
    </div>
</footer>
<script src="script.js"></script>
</body>
</html>
