<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0866ff"><title>Sign Up | TBS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head>
<body class="login-page"><header class="site-header"><nav class="navbar"><a href="index.html" class="logo" aria-label="TBS home"><span>TBS</span> The Blue Style</a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="login.html">Login</a></li><li><a href="signup.html" class="active">Sign Up</a></li></ul><a href="index.html#shop" class="shop-btn">Shop Now</a></nav></header><main class="login-section"><div class="login-container"><section class="login-intro"><span class="login-eyebrow">CREATE YOUR ACCOUNT</span><h1>Join <span>TBS.</span></h1><p>Save your details, follow your orders, and stay close to new fashion, technology, printing, and digital releases.</p></section><section class="login-card"><div class="login-card-header"><div class="login-logo">TBS</div><div><h2>Create account</h2><p>Join The Blue Style</p></div></div><p id="signupMessage" class="login-message" role="alert" aria-live="polite"></p><form id="signup-form" novalidate><div class="form-group"><label for="signup-name">Full name</label><input id="signup-name" name="full_name" type="text" autocomplete="name" required maxlength="120" placeholder="Your full name"></div><div class="form-group"><label for="signup-email">Email address</label><input id="signup-email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></div><div class="form-group"><label for="signup-phone">Phone number</label><input id="signup-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" placeholder="+263"></div><div class="form-group"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="At least 8 characters"></div><div class="form-group"><label for="signup-confirm-password">Confirm password</label><input id="signup-confirm-password" name="confirm_password" type="password" autocomplete="new-password" required placeholder="Repeat your password"></div><label class="remember-me"><input name="terms" type="checkbox" required><span>I agree to the TBS Terms and Conditions.</span></label><button class="login-submit" type="submit"><span>Create Account</span><i class="fa-solid fa-arrow-right"></i></button><p id="signup-status" class="signup-status" role="status" aria-live="polite"></p></form><div class="login-divider"><span>OR</span></div><button class="google-login-button oauth-placeholder" type="button" data-provider="Google">Continue with Google</button><button class="google-login-button oauth-placeholder" type="button" data-provider="Facebook">Continue with Facebook</button><p class="signup-link">Already have an account? <a href="login.html">Log in</a></p></section></div></main><script src="api-config.js"></script><script src="js/auth.js"></script></body></html>
