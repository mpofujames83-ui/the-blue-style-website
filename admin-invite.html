<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Accept TBS Admin Invitation</title><link rel="stylesheet" href="style.css"><style>body{margin:0;background:#f5f8fc;color:#071a33;font-family:Poppins,Arial,sans-serif}.invite{width:min(100% - 30px,480px);margin:9vh auto;padding:34px;background:#fff;border:1px solid #dce5ef;border-radius:14px;box-shadow:0 20px 55px #071a3315}.invite h1{margin:8px 0 12px}.invite p{color:#667085;line-height:1.6}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:12px;font-weight:700}.field input{padding:13px;border:1px solid #dce5ef;border-radius:8px;background:#f5f8fc;font:inherit}.field input:focus{outline:0;border-color:#0866ff;box-shadow:0 0 0 4px #0866ff15}.button{width:100%;padding:14px;border:0;border-radius:8px;background:#0866ff;color:#fff;font:inherit;font-weight:700;cursor:pointer}.button:hover{background:#0546b8}.status{min-height:22px;font-size:13px}.success{color:#176b3a}.error{color:#b42318}</style></head><body><main class="invite"><span class="eyebrow">THE BLUE STYLE</span><h1>Accept Admin Invitation</h1><p>Complete your secure account setup to join the TBS administration team.</p><form id="inviteForm"><div class="field"><label for="name">Full name</label><input id="name" name="name" required maxlength="120"></div><div class="field"><label for="password">Create password</label><input id="password" name="password" type="password" minlength="8" required maxlength="128"></div><p class="status" id="status"></p><button class="button" type="submit">Create administrator account</button></form></main><script src="api-config.js"></script><script>const form=document.getElementById('inviteForm'),status=document.getElementById('status'),token=new URLSearchParams(location.search).get('token');form.addEventListener('submit',async event=>{event.preventDefault();if(!token){status.textContent='This invitation link is missing its secure token.';status.className='status error';return}try{const body=Object.fromEntries(new FormData(form));body.token=token;const response=await window.tbsFetch('/admin/invitations/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw new Error(result.message);status.textContent='Account created. You can now sign in.';status.className='status success';form.querySelector('button').disabled=true}catch(error){status.textContent=error.message;status.className='status error'}});</script></body></html>
