<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | TBS</title><link rel="stylesheet" href="style.css"><style>.cart-page{max-width:1000px;margin:auto;padding:60px 6%}.cart-page h1{font-size:clamp(36px,5vw,58px)}.cart-page-item{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid #dce5ef}.cart-page-item img{width:90px;height:90px;object-fit:cover;border-radius:8px;background:#f5f8fc}.cart-page-item h2{margin:0;font-size:17px}.cart-page-item p{color:#667085}.cart-page-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cart-page-controls button{border:1px solid #dce5ef;border-radius:6px;background:#fff;padding:8px 11px;cursor:pointer}.cart-page-controls button:hover{background:#0866ff;color:#fff}.cart-page-summary{margin:28px 0 0 auto;max-width:340px;display:grid;gap:12px}.cart-page-summary div{display:flex;justify-content:space-between;border-bottom:1px solid #dce5ef;padding:10px 0}.cart-page-empty{text-align:center;padding:60px 20px;background:#fff;border:1px solid #dce5ef;border-radius:12px}.cart-page-empty .btn{margin-top:12px}@media(max-width:600px){.cart-page{padding:40px 5%}.cart-page-item{grid-template-columns:70px 1fr}.cart-page-item>strong{grid-column:2}.cart-page-item img{width:70px;height:70px}}
</style></head><body><header class="header"><a class="brand" href="index.html"><span class="brand-text"><strong>TBS</strong><small>The Blue Style</small></span></a><a class="btn btn-primary" href="index.html#shop">Continue Shopping</a></header><main class="cart-page"><span class="eyebrow">TBS SHOP</span><h1>Your Cart <small>(<span id="cartCountPage">0</span>)</small></h1><section id="cartItemsPage"></section><div class="cart-page-summary"><div><span>Subtotal</span><strong id="cartSubtotal">$0.00</strong></div><div><span>Shipping</span><strong id="cartShipping">$0.00</strong></div><div><span>Total</span><strong id="cartTotalPage">$0.00</strong></div><a class="btn btn-primary" href="checkout.html">Proceed to Checkout</a></div></main><script src="api-config.js"></script><script src="js/auth.js"></script><script src="cart.js"></script></body></html>
