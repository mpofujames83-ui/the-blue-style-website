<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | TBS</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><header class="site-header"><nav class="navbar"><a class="logo" href="index.html"><span>TBS</span> AI</a><a class="shop-btn" href="index.html#shop">Shop TBS</a></nav></header><main class="login-section"><section class="login-card"><span class="login-eyebrow">TBS ACCOUNT</span><h1>My Account</h1><p id="accountMessage">Loading your account...</p><a class="btn btn-primary" href="index.html">Continue shopping</a></section></main><script src="api-config.js"></script><script src="auth-navigation.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const response=await window.tbsFetch('/users/me',{headers:{Authorization:`Bearer ${localStorage.getItem('tbsToken')}`}});if(response.ok){const user=await response.json();document.getElementById('accountMessage').textContent=`Welcome back, ${user.full_name}. Your account is active.`;}});</script></body></html>
